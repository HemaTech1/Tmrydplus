<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Nursing Question Bank – Interactive Quiz</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--c:#fff;--t:#1a2238;--m:#5d6785;--p:#1e3a8a;--ok:#16794a;--okb:#dff5e8;--no:#b42318;--nob:#fde4e1;--bd:#d5dbea}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0f1424;--c:#182039;--t:#e8ecf8;--m:#9aa5c6;--p:#7aa2ff;--ok:#6fe0a3;--okb:#12382a;--no:#ff9b91;--nob:#4a1d1a;--bd:#2c3659}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:.2em 0}
.card{background:var(--c);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:12px 0}
.sub{color:var(--m);font-size:.9rem}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--c);color:var(--t);padding:10px 14px}
button.pri{background:var(--p);color:#fff;border-color:var(--p)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) button.pri{color:#0f1424}}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}
.opt.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.opt.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sec{display:block;width:100%;text-align:left;margin:8px 0}
.q{font-size:1.1rem;font-weight:600;margin:10px 0}
.note{margin-top:10px;padding:10px;border-radius:10px;background:var(--bg)}
label{display:block;margin:8px 0}
</style></head><body><main id="app"></main>

const ALL=RAW.trim().split("\n").map(l=>{const[s,n,q,o,a]=l.split("|");return{s,n,q,o:o.split("~"),a:+a}});
const SEC={M:"Perioperative MCQs",T:"Perioperative True / False",G:"GIT Disorders MCQs"};
const L="ABCD";let st={};const $=document.getElementById("app");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function home(){
$.innerHTML=`<h1>🩺 Nursing Question Bank</h1><p class="sub">${ALL.length} أسئلة · اختبار تفاعلي مع تصحيح فوري</p>
<div class="card"><b>اختر القسم</b>${Object.keys(SEC).map(k=>`<button class="sec" onclick="start('${k}')">${SEC[k]} <span class="sub">(${ALL.filter(x=>x.s==k).length})</span></button>`).join("")}
<button class="sec pri" onclick="start('all')">كل الأسئلة (${ALL.length})</button>
<label><input type="checkbox" id="sh"> ترتيب عشوائي</label></div>
<p class="sub">ملاحظة: ملف الـPDF لا يحتوي مفتاح إجابات للـMCQ (فقط T/F)، فالإجابات الصحيحة للـMCQ مستنتجة من المنهج وقد تحتاج مراجعة مع المدرّس.</p>`}
function start(k){let qs=ALL.filter(x=>k=="all"||x.s==k);
if(document.getElementById("sh").checked)qs=[...qs].sort(()=>Math.random()-.5);
st={qs,i:0,sc:0,wrong:[],done:false};show()}
function show(){const{qs,i}=st;if(i>=qs.length)return end();const q=qs[i];
$.innerHTML=`<div class="sub">${SEC[q.s]} · Q${q.n} — ${i+1}/${qs.length} · ✔ ${st.sc}</div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
<div class="card"><div class="q">${esc(q.q)}</div>${q.o.map((o,j)=>`<button class="opt" onclick="pick(${j})">${q.s=="T"?"":L[j]+". "}${esc(o)}</button>`).join("")}<div id="fb"></div></div>
<div class="row"><button onclick="home()">🏠 الرئيسية</button></div>`}
function pick(j){const q=st.qs[st.i];if(st.done)return;st.done=true;
document.querySelectorAll(".opt").forEach((b,k)=>{if(k==q.a)b.classList.add("ok");else if(k==j)b.classList.add("no");b.disabled=true});
if(j==q.a)st.sc++;else st.wrong.push(q);
document.getElementById("fb").innerHTML=`<div class="note">${j==q.a?"✅ إجابة صحيحة":"❌ خطأ — الصحيح: "+(q.s=="T"?"":L[q.a]+". ")+esc(q.o[q.a])}</div><div class="row"><button class="pri" onclick="nx()">${st.i+1==st.qs.length?"النتيجة":"التالي ←"}</button></div>`}
function nx(){st.i++;st.done=false;show()}
function end(){const n=st.qs.length,p=Math.round(st.sc/n*100);
$.innerHTML=`<h1>النتيجة: ${st.sc}/${n} (${p}%)</h1><div class="bar"><i style="width:${p}%"></i></div>
<div class="row"><button class="pri" onclick="again()">أعد الأسئلة الخاطئة (${st.wrong.length})</button><button onclick="home()">🏠 الرئيسية</button></div>
${st.wrong.map(q=>`<div class="card"><div class="sub">Q${q.n}</div>${esc(q.q)}<div class="note">✔ ${esc(q.o[q.a])}</div></div>`).join("")}`}
function again(){if(!st.wrong.length)return home();st={qs:st.wrong,i:0,sc:0,wrong:[],done:false};show()}
home();
</script></body></html>
